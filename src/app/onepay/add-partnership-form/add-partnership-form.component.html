<div class="flex flex-col flex-auto min-w-0">
    <form class="flex flex-col mt-8 p-8 pb-4 bg-card rounded-2xl shadow overflow-hidden" (ngSubmit)="onSubmit()" [formGroup]="partnershipForm">
            <div class="flex flex-col gt-xs:flex-row">
                <mat-form-field
                    [ngClass]="formFieldHelpers"
                    class="flex-auto gt-xs:pr-3">
                    <mat-label>Entreprise</mat-label>
                    <mat-select
                    formControlName="enterprise"
                    id="enterprise">
                        <mat-option *ngFor="let enterprise of enterprises" [value]="enterprise.id">
                            {{ enterprise.name }}
                        </mat-option>
                    </mat-select>
                    <mat-icon
                        class="icon-size-5"
                        matPrefix
                        [svgIcon]="'heroicons_solid:location-marker'"></mat-icon>
                </mat-form-field>
            </div>

            <div class="flex flex-col gt-xs:flex-row">
                <mat-form-field
                    [ngClass]="formFieldHelpers"
                    class="flex-auto gt-xs:pr-3">
                    <mat-label>Sales</mat-label>
                    <mat-select
                    formControlName="sales"
                    id="sales">
                        <mat-option *ngFor="let sales of salesList" [value]="sales.id">
                            {{ sales.name }}
                        </mat-option>
                    </mat-select>
                    <mat-icon
                        class="icon-size-5"
                        matPrefix
                        [svgIcon]="'heroicons_solid:location-marker'"></mat-icon>
                </mat-form-field>
            </div>

            <div class="flex flex-col gt-xs:flex-row">
                <mat-form-field
                    [ngClass]="formFieldHelpers"
                    class="flex-auto gt-xs:pr-3">
                    <mat-label>Status</mat-label>
                    <mat-select 
                    formControlName="status"
                    id="status">
                        <mat-option [value]="'ACTIVE'">ACTIVE</mat-option>
                        <mat-option [value]="'INACTIVE'">INACTIVE</mat-option>
                    </mat-select>
                    <mat-icon
                        class="icon-size-5"
                        matPrefix
                        [svgIcon]="'heroicons_solid:location-marker'"></mat-icon>
                </mat-form-field>
            </div>
            <button mat-flat-button type="submit">Enregistrer</button>
    </form>
</div>
